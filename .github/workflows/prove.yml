# GYR-FIX-001 F2 + WORLD-A-001 — product heartbeat + sealed-front CI gate
name: prove
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ python3 python3-dev python3-pip

      - name: Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pybind11 setuptools wheel

      - name: Build binding
        run: |
          cd python/bindings
          python3 setup.py build_ext --inplace

      - name: --prove
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/python:${GITHUB_WORKSPACE}/python/bindings"
          python3 python/pair_sieve_cli.py --prove --json | tee /tmp/prove.json
          python3 -c "import json; r=json.load(open('/tmp/prove.json')); assert r.get('prove_ok') is True, r; print('prove_ok=true')"

      - name: book CSV identity
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/python:${GITHUB_WORKSPACE}/python/bindings"
          python3 python/pair_sieve_cli.py --csv examples/book.csv --x-col risk --y-col cost --json | tee /tmp/book.json
          python3 -c "import json; r=json.load(open('/tmp/book.json')); assert r.get('identity_ok') is True, r; assert r.get('identity_mode') == 'fenwick_oracle', r; print(r['identity_mode'], 'ok')"

      - name: book sealed bundle + verify
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/python:${GITHUB_WORKSPACE}/python/bindings"
          mkdir -p /tmp/book_bundle
          python3 python/pair_sieve_cli.py \
            --csv examples/book.csv \
            --x-col risk --y-col cost \
            --bundle /tmp/book_bundle
          python3 python/verify_bundle.py /tmp/book_bundle
          echo "book verify_bundle exit 0"
          python3 -c "import json; r=json.load(open('/tmp/book_bundle/report.json')); assert r.get('identity_ok') is True; print('book identity_sha256=', r.get('identity_sha256')); print('promote_ready=', r.get('promote_ready'))"

      - name: California stranger sealed bundle + verify
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/python:${GITHUB_WORKSPACE}/python/bindings"
          mkdir -p /tmp/ca_bundle
          python3 python/pair_sieve_cli.py \
            --csv docs/stranger/california_housing_two_col.csv \
            --x-col median_income --y-col median_house_value \
            --x-sense higher --y-sense higher \
            --bundle /tmp/ca_bundle
          python3 python/verify_bundle.py /tmp/ca_bundle
          echo "CA verify_bundle exit 0"
          python3 -c "import json; r=json.load(open('/tmp/ca_bundle/report.json')); assert r.get('identity_ok') is True; print('CA identity_sha256=', r.get('identity_sha256')); print('front_size=', r.get('front_size')); print('promote_ready=', r.get('promote_ready'))"
