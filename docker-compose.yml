services:
  prym-gyro-rank:
    build: .
    image: prym-gyro-sort:0.1.3
    environment:
      N: "4096"
      SEED: "728"
      MODE: "synthetic"
      MEMORY_PRESSURE: "0"
    volumes:
      - ./work:/work

  finance:
    build: .
    image: prym-gyro-sort:0.1.3
    profiles: ["finance"]
    environment:
      N: "4096"
      SEED: "42"
      MODE: "finance"
      MEMORY_PRESSURE: "0"
    volumes:
      - ./work:/work

  # Isolated Visualization Profile (Path A) — never builds the C++ core.
  # Usage: docker compose --profile viz run --rm viz
  viz:
    profiles: ["viz"]
    image: python:3.11-slim
    working_dir: /work
    volumes:
      - ./work:/work
      - ./python:/opt/viz:ro
    command: >
      sh -c "pip install -q numpy &&
             python /opt/viz/viz_pareto.py --dir /work --format both"
